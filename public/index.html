<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%234f9dff%22/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beep Link</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
/* Layout: full-screen 3D glass helix; one status chip top-right, one "Send sound" button at the bottom; settings in a sheet. Deliberately dark-only. */
:root{
  color-scheme:dark;
  --bg:#000000; --glass:rgba(120,170,255,.12); --glass-line:rgba(170,205,255,.3); --fg:#eaf2ff; --muted:#8ea6c8;
  --accent:#4f9dff; --ok:#49e39b;
  --display:"Sora",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.chip{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:inherit;font-size:.8rem;color:var(--fg);cursor:pointer;max-width:60%}
.chip i{width:8px;height:8px;border-radius:50%;background:#55627a;flex:none}
.chip.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:fixed;z-index:3;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-10px);opacity:0;transition:opacity .3s,transform .3s;
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:.95rem;white-space:nowrap;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}

.send{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:min(calc(100% - 32px),340px);padding:18px 24px;border-radius:999px;border:1px solid rgba(190,220,255,.5);cursor:pointer;
  font-family:var(--display);font-weight:500;font-size:1.1rem;letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,rgba(140,190,255,.32),rgba(40,90,200,.18));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 18px rgba(20,60,160,.3),0 10px 40px -8px rgba(79,157,255,.5);
  transition:transform .1s,opacity .2s}
.send:active:not(:disabled){transform:translateX(-50%) scale(.97)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send{display:flex;align-items:center;justify-content:center;gap:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.send .dot{width:10px;height:10px;border-radius:50%;background:#ff5c6c;box-shadow:0 0 0 0 rgba(255,92,108,.6);flex:none}
.send.rec{border-color:rgba(255,140,150,.7);background:linear-gradient(180deg,rgba(255,110,130,.35),rgba(160,30,60,.25));font-variant-numeric:tabular-nums}
.send.rec .dot{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,108,.7)}100%{box-shadow:0 0 0 12px rgba(255,92,108,0)}}
.msg{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--fg);font:inherit;font-size:.95rem;cursor:pointer;max-width:calc(100% - 32px)}
.msg .pl{width:26px;height:26px;border-radius:50%;background:var(--accent);flex:none;position:relative}
.msg .pl::after{content:"";position:absolute;left:10px;top:7px;border-left:9px solid #00122e;border-top:6px solid transparent;border-bottom:6px solid transparent}
.msg.on .pl::after{left:8px;top:8px;width:3px;height:10px;border:0;background:#00122e;box-shadow:6px 0 0 #00122e}
.msg.wait{border-color:var(--accent);box-shadow:0 0 24px -4px var(--accent)}
.msg .dur{color:var(--muted);font-family:var(--mono);font-size:.8rem}
#msgName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.send.rec .dot{animation:none}}

.sheet{position:fixed;z-index:4;inset:auto 0 0 0;max-height:88%;overflow:auto;background:linear-gradient(180deg,rgba(14,24,46,.9),rgba(6,10,20,.97));
  border-top:1px solid var(--glass-line);border-radius:26px 26px 0 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet input{font:inherit;width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(0,0,0,.35);color:var(--fg);font-size:16px}
.sheet input.code{font-family:var(--mono);font-size:1.4rem;letter-spacing:.35em;text-transform:uppercase;text-align:center}
.sounds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.snd{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 2px;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.05);
  color:var(--fg);font:inherit;font-size:.74rem;cursor:pointer}
.snd .sw{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 45%,#000 120%);box-shadow:0 0 12px var(--c)}
.snd[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.1)}
.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:14px;border:1px solid var(--glass-line);padding:13px 16px;background:rgba(255,255,255,.06);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#00122e}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr auto;gap:10px}
.err{color:#ff8a8a;font-size:.9rem;margin:0}
.code-big{font-family:var(--mono);font-size:1.6rem;letter-spacing:.3em;text-align:center}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--glass-line);font:inherit;color:var(--fg);cursor:pointer}
.tg .sw2{width:40px;height:24px;border-radius:99px;background:#33405a;position:relative;flex:none}
.tg .sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-pressed="true"] .sw2{background:var(--ok)}
.tg[aria-pressed="true"] .sw2::after{left:19px}
button:focus-visible,input:focus-visible{outline:2px solid #9cc8ff;outline-offset:2px}
</style>

</head>
<body>
<canvas id="scene" aria-label="Glass spheres wrapped in a spiral ribbon"></canvas>
<button class="chip" id="chip"><i></i><span id="chipText">Pair</span></button>
<div class="toast" id="toast"><i></i><span></span></div>
<button class="msg" id="msg" hidden><span class="pl" aria-hidden="true"></span><span id="msgName"></span><span class="dur" id="msgDur"></span></button>
<button class="send" id="talkBtn" disabled><span class="dot" aria-hidden="true"></span><span id="talkLbl">Hold to talk</span></button>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div id="setupPart" style="display:contents">
      <input id="nameIn" maxlength="16" placeholder="Name" autocomplete="nickname" aria-label="Your name">
      <button class="btn primary" id="newBtn">New code</button>
      <div class="row">
        <input id="codeIn" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Pairing code">
        <button class="btn" id="joinBtn">Join</button>
      </div>
      <p class="err" id="err" hidden></p>
    </div>
    <div id="pairedPart" hidden style="display:contents">
      <div class="code-big" id="codeLbl"></div>
      <div class="row">
        <button class="btn primary" id="closeBtn">Done</button>
        <button class="btn" id="leaveBtn">Unpair</button>
      </div>
    </div>
  </div>
</div>

<script src="/three/build/three.min.js"></script>
<script src="/three/examples/js/shaders/CopyShader.js"></script>
<script src="/three/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="/three/examples/js/postprocessing/EffectComposer.js"></script>
<script src="/three/examples/js/postprocessing/ShaderPass.js"></script>
<script src="/three/examples/js/postprocessing/RenderPass.js"></script>
<script src="/three/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const $=id=>document.getElementById(id);
const SOUNDS={
  chirp:{label:"Chirp",color:"#7fd3ff"},
  ding:{label:"Ding",color:"#4f9dff"},
  buzz:{label:"Buzz",color:"#5ee3c1"},
  boing:{label:"Boing",color:"#b18cff"},
  siren:{label:"Siren",color:"#ff8ab3"}
};
const ALPH="abcdefghjkmnpqrstuvwxyz23456789";
let actx=null, me={name:"",sound:"ding"}, partner=null, shakeOn=false;
try{ const s=JSON.parse(localStorage.getItem("beepme")||"null"); if(s){ me.name=s.name||""; if(SOUNDS[s.sound]) me.sound=s.sound; } }catch(e){}
const savePrefs=()=>{ try{ localStorage.setItem("beepme",JSON.stringify(me)); }catch(e){} };

/* ================= 3D: glass spheres + helical ribbons ================= */
let spinVel=.18, glowTarget=0, glow=0, tint=null;
(function(){
  if(!window.THREE) return;
  try{
    const canvas=$("scene");
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
    renderer.physicallyCorrectLights=true;

    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000);
    const camera=new THREE.PerspectiveCamera(30,1,.1,100);
    tint=new THREE.Color("#4f9dff");

    // ---- light studio for reflections: black room, soft white key box, blue side panels, thin strip lights
    (function(){
      const env=new THREE.Scene(); env.background=new THREE.Color(0x010206);
      const panel=(w,h,color,intensity,pos,look)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(intensity),side:THREE.DoubleSide}));
        m.position.set(...pos); m.lookAt(...look); env.add(m); };
      panel(6,4,0xffffff,6,[-6,7,6],[0,0,0]);        // big soft key, upper left front
      panel(2,10,0x3d7dff,4,[9,0,-2],[0,0,0]);        // tall blue right
      panel(2,10,0x1e4fd8,3,[-9,-1,-3],[0,0,0]);      // tall blue left
      panel(.4,12,0xdfeaff,10,[4,0,8],[0,0,0]);       // thin strip (sharp highlight)
      panel(8,2,0x0b2a7a,2,[0,-8,0],[0,0,0]);         // dim blue floor bounce
      panel(12,5,0xeef4ff,1.6,[0,3,14],[0,0,0]);      // soft fill behind camera (silver reads bright)
      panel(3,3,0x9cc4ff,3,[2,9,-6],[0,0,0]);         // cool top back
      const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(env,.02).texture;
    })();

    // ---- backdrop the glass refracts: deep navy glow fading to black
    const bc=document.createElement("canvas"); bc.width=bc.height=512; const bg=bc.getContext("2d");
    const gr=bg.createRadialGradient(256,280,10,256,280,256); gr.addColorStop(0,"#0f3184"); gr.addColorStop(.3,"#061640"); gr.addColorStop(.65,"#01050f"); gr.addColorStop(1,"#000");
    bg.fillStyle=gr; bg.fillRect(0,0,512,512);
    const bgTex=new THREE.CanvasTexture(bc); bgTex.encoding=THREE.sRGBEncoding;
    const backdrop=new THREE.Mesh(new THREE.PlaneGeometry(26,26),new THREE.MeshBasicMaterial({map:bgTex,toneMapped:false}));
    backdrop.position.set(0,-.5,-7); scene.add(backdrop);

    const key=new THREE.SpotLight(0xdfeeff,260,40,.6,.6); key.position.set(-4,8,9); scene.add(key);
    const rim=new THREE.PointLight(0x2f6bff,200,30); rim.position.set(5,1,-4); scene.add(rim);
    const core=new THREE.PointLight(0x4f9dff,40,12); core.position.set(0,-1,0); scene.add(core);

    const group=new THREE.Group(); scene.add(group);
    const TOP=7;

    // ---- spheres hanging on threads (x, y, radius, z) top → bottom
    const balls=[[0,4.6,.55,-.1],[.1,3.05,.42,.2],[0,2.35,.62,-.15],[-.3,.75,.72,0],[.45,-.4,.86,.25],[.35,-1.98,.8,-.1],[-.45,-3.15,.6,.2],[-.15,-4.45,1.35,0]];
    const hung=[], sphereMats=[], rimMats=[];
    const sparkTex=(()=>{ const c=document.createElement("canvas"); c.width=c.height=64; const g=c.getContext("2d");
      const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.25,"rgba(170,210,255,.6)"); r.addColorStop(1,"rgba(0,0,0,0)");
      g.fillStyle=r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
    balls.forEach(([x,y,r,z],i)=>{
      const holder=new THREE.Group(); holder.position.set(x,y,z); group.add(holder);
      const m=new THREE.MeshPhysicalMaterial({
        color:0xeaf2ff, metalness:0, roughness:0, transmission:1, thickness:r*1.2, ior:1.45,
        attenuationColor:new THREE.Color(0x5b8cf0), attenuationDistance:r*7,
        specularIntensity:1, specularColor:new THREE.Color(0xffffff), clearcoat:1, clearcoatRoughness:0, envMapIntensity:1.8, emissive:0x000000
      });
      holder.add(new THREE.Mesh(new THREE.SphereGeometry(r,96,64),m)); sphereMats.push(m);
      // luminous edge, like light caught in the glass wall
      const rimM=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{c:{value:new THREE.Color(0x7fb2ff)},k:{value:1}},
        vertexShader:"varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}",
        fragmentShader:"uniform vec3 c;uniform float k;varying vec3 vN;varying vec3 vV;void main(){float d=max(dot(vN,vV),0.);float f=pow(1.-d,3.)*.85+.05*pow(d,4.);gl_FragColor=vec4(c*f*k,1.);}"});
      holder.add(new THREE.Mesh(new THREE.SphereGeometry(r*1.003,96,64),rimM)); rimMats.push(rimM);
      // tiny sparkles suspended inside the glass
      const n=Math.round(10+r*14), pts=[];
      for(let j=0;j<n;j++){ const u=Math.random(),v=Math.random(),w=Math.cbrt(Math.random())*r*.82, th=u*Math.PI*2, ph=Math.acos(2*v-1);
        pts.push(w*Math.sin(ph)*Math.cos(th),w*Math.cos(ph),w*Math.sin(ph)*Math.sin(th)); }
      const pg=new THREE.BufferGeometry(); pg.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
      holder.add(new THREE.Points(pg,new THREE.PointsMaterial({map:sparkTex,size:.1,sizeAttenuation:true,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending,color:0xcfe3ff})));
      // thread from the sphere's top up out of frame
      const anchor=new THREE.Vector3(x+(Math.random()-.5)*.5,TOP,z);
      const tg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,y+r,z),anchor]);
      group.add(new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xaac4ea,transparent:true,opacity:.14})));
      hung.push({holder,rest:new THREE.Vector3(x,y,z),r,anchor,tg,phase:Math.random()*6.28,len:TOP-y,swing:0});
    });

    // ---- helix paths: wide loops up top, tighter around the spheres lower down
    const helix=(phase,turns,scale)=>t=>{
      const y=5.7-11.4*t, r=(1.5*Math.exp(-2.4*t)+.82+.18*Math.sin(t*8))*scale, a=phase+t*Math.PI*2*turns;
      return new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r);
    };
    class Path extends THREE.Curve{ constructor(f){ super(); this.f=f; } getPoint(t,v=new THREE.Vector3()){ return v.copy(this.f(t)); } }

    // flat band that faces outward and gently twists; returns geometry + its two edge paths
    function ribbon(f,width,segs,twist){
      const pos=[],idx=[]; const up=new THREE.Vector3();
      const frame=t=>{ const p=f(t), p2=f(Math.min(1,t+1e-3)), p0=f(Math.max(0,t-1e-3));
        const T=p2.clone().sub(p0).normalize(), N=new THREE.Vector3(p.x,0,p.z).normalize(), B=new THREE.Vector3().crossVectors(T,N).normalize();
        const ang=Math.sin(t*Math.PI*2*twist)*.6, W=B.multiplyScalar(Math.cos(ang)).add(N.multiplyScalar(Math.sin(ang)));
        const w=width*(.55+.45*Math.sin(Math.PI*Math.min(1,t*1.1+.05)));
        return [p,W.multiplyScalar(w/2)]; };
      for(let i=0;i<=segs;i++){ const [p,h]=frame(i/segs);
        pos.push(p.x+h.x,p.y+h.y,p.z+h.z, p.x-h.x,p.y-h.y,p.z-h.z);
        if(i<segs){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); } }
      const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
      return {g, edgeA:t=>{const [p,h]=frame(t);return p.add(h);}, edgeB:t=>{const [p,h]=frame(t);return p.sub(h);}};
    }

    const silver=new THREE.MeshPhysicalMaterial({color:0xe6eeff,metalness:1,roughness:.08,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.7,emissive:0x000000});
    const edgeMat=new THREE.MeshPhysicalMaterial({color:0xcfe0ff,metalness:1,roughness:.1,clearcoat:1,envMapIntensity:1.8,emissive:0x000000});
    // main polished tube
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new Path(helix(0,2.7,1)),700,.05,20,false),silver));
    // wide translucent blue glass band with metal-rolled edges
    const bandM=new THREE.MeshPhysicalMaterial({color:0x5a8fff,metalness:.1,roughness:.05,transmission:.65,thickness:.15,ior:1.45,clearcoat:1,clearcoatRoughness:.02,
      side:THREE.DoubleSide,envMapIntensity:1.4,transparent:true,opacity:.9,emissive:0x061a52,emissiveIntensity:.5,attenuationColor:new THREE.Color(0x2c63e0),attenuationDistance:.6});
    const b1=ribbon(helix(.2,2.7,1.05),.46,700,3); group.add(new THREE.Mesh(b1.g,bandM));
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new Path(b1.edgeA),700,.016,8,false),edgeMat));
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new Path(b1.edgeB),700,.016,8,false),edgeMat));
    // second deeper-blue band on the opposite side
    const bandM2=new THREE.MeshPhysicalMaterial({color:0x2458d6,metalness:.35,roughness:.08,clearcoat:1,clearcoatRoughness:.03,side:THREE.DoubleSide,envMapIntensity:1.5,emissive:0x041240,emissiveIntensity:.45});
    const b2=ribbon(helix(Math.PI*.95,2.7,1.09),.28,700,2); group.add(new THREE.Mesh(b2.g,bandM2));
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new Path(b2.edgeA),700,.012,8,false),edgeMat));
    // thin bright accent wire
    const wire=new THREE.MeshPhysicalMaterial({color:0xa9ceff,metalness:1,roughness:.15,envMapIntensity:1.6,emissive:0x000000});
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new Path(helix(Math.PI*1.08,2.7,1.02)),700,.02,10,false),wire));

    group.rotation.x=.05;

    // ---- post: bloom, then a lens pass (vignette, fine grain, slight colour fringing)
    let composer=null, bloom=null, lens=null;
    if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.ShaderPass){
      composer=new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene,camera));
      bloom=new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.5,.55,.8); composer.addPass(bloom);
      lens=new THREE.ShaderPass({
        uniforms:{tDiffuse:{value:null},time:{value:0},ca:{value:.0015}},
        vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
        fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform float ca;varying vec2 vUv;
          float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+time)*43758.5453);}
          void main(){vec2 d=vUv-.5;float r2=dot(d,d);
            vec3 c=vec3(texture2D(tDiffuse,vUv+d*ca*r2*8.).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-d*ca*r2*8.).b);
            c*=smoothstep(.95,.18,r2*2.1);
            c+=(h(vUv*vec2(1013.,997.))-.5)*.035;
            gl_FragColor=vec4(c,1.);}`
      });
      composer.addPass(lens);
    }

    function resize(){
      const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); composer&&composer.setSize(w,h);
      camera.aspect=w/h; const v=Math.tan(camera.fov*Math.PI/360);
      camera.position.set(0,-.7,Math.max(7.6/v,2.7/(v*camera.aspect))); camera.lookAt(0,-.9,0); camera.updateProjectionMatrix();
    }
    addEventListener("resize",resize); resize();

    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, idle=reduce?0:.18;
    let last=performance.now(), spin=0, prevVel=spinVel; const tmp=new THREE.Color(), BLACK=new THREE.Color(0), RIM=new THREE.Color(0x7fb2ff);
    (function loop(now){
      const dt=Math.min(.05,(now-last)/1000); last=now; const ts=now/1000;
      spinVel+=(idle-spinVel)*Math.min(1,dt*1.1); spin+=spinVel*dt;
      const accel=(spinVel-prevVel)/Math.max(dt,1e-3); prevVel=spinVel;
      group.rotation.y=spin; group.position.y=Math.sin(ts/1.7)*.07;
      // pendulum sway: spheres flare outward with spin and lag behind sudden starts
      hung.forEach(b=>{
        b.swing+=(Math.min(Math.abs(spinVel),16)*.018 - b.swing)*Math.min(1,dt*3);
        const lag=THREE.MathUtils.clamp(-accel*.004,-.25,.25);
        const ax=Math.atan2(b.rest.z,b.rest.x||1e-4);
        const out=b.swing*b.len*.08, wob=Math.sin(ts*Math.sqrt(9.8/b.len)*2+b.phase)*(.02+b.swing*.12);
        b.holder.position.set(b.rest.x+Math.cos(ax)*out+Math.sin(ax)*lag+wob, b.rest.y+out*out*.15, b.rest.z+Math.sin(ax)*out-Math.cos(ax)*lag);
        const tp=b.tg.attributes.position; tp.setXYZ(0,b.holder.position.x,b.holder.position.y+b.r,b.holder.position.z); tp.needsUpdate=true;
        b.holder.rotation.y+=dt*.2;
      });
      glow+=(glowTarget-glow)*Math.min(1,dt*6); glowTarget*=Math.pow(.22,dt);
      tmp.copy(BLACK).lerp(tint,glow);
      sphereMats.forEach(m=>{ m.emissive.copy(tmp); m.emissiveIntensity=glow*.5; });
      [silver,wire,edgeMat].forEach(m=>{ m.emissive.copy(tmp); m.emissiveIntensity=glow*.9; });
      rimMats.forEach(m=>{ m.uniforms.c.value.copy(RIM).lerp(tint,glow); m.uniforms.k.value=1+glow*1.5; });
      core.color.copy(tint); core.intensity=40+glow*260;
      if(bloom) bloom.strength=.5+glow*1.1;
      if(lens) lens.uniforms.time.value=ts%100;
      composer?composer.render():renderer.render(scene,camera);
      requestAnimationFrame(loop);
    })(last);
  }catch(e){ console.error(e); }
})();
function twirl(color,strength){ spinVel=strength; glowTarget=1; if(tint) tint.set(color); }

/* ================= voice messages ================= */
const ME_COLOR="#7fd3ff", THEM_COLOR="#4f9dff", MAX_SEC=30, RATE=16000;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
  const o=actx.createOscillator(),g=actx.createGain(); g.gain.value=0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.01);}catch(e){} }
function session(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }  // iPhone: play even with silent switch on
session("playback");
const fmt=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function level(v,color){ glowTarget=Math.max(glowTarget,Math.min(1,v*5)); spinVel=Math.max(spinVel,1.5+Math.min(v,.4)*40); if(tint) tint.set(color); }

let toastT;
function toast(text,color){ const t=$("toast"); t.querySelector("span").textContent=text; t.querySelector("i").style.setProperty("--c",color);
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ---- record: mic → 16 kHz mono WAV, which every phone can play ---- */
let rec=null, holding=false, pressId=0;
function setTalk(state,t){
  const b=$("talkBtn"); b.classList.toggle("rec",state==="recording");
  $("talkLbl").textContent= state==="recording" ? fmt(t||0) : state==="starting" ? "…" : "Hold to talk";
}
function micErr(e){
  if(!navigator.mediaDevices) return "Open the https link to use the microphone.";
  if(e&&e.name==="NotAllowedError") return "Allow the microphone for this site in settings.";
  if(e&&e.name==="NotFoundError") return "No microphone found.";
  return "Microphone unavailable.";
}
async function startRec(){
  unlockAudio(); if(rec||$("talkBtn").disabled) return;
  const id=++pressId; holding=true; setTalk("starting");
  let stream;
  try{ session("play-and-record"); stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}); }
  catch(e){ session("playback"); setTalk("idle"); toast(micErr(e),"#ff8a8a"); return; }
  if(id!==pressId||!holding){ stream.getTracks().forEach(t=>t.stop()); session("playback"); setTalk("idle"); return; }
  try{ if(actx.state!=="running") await actx.resume(); }catch(e){}
  const src=actx.createMediaStreamSource(stream), proc=actx.createScriptProcessor(4096,1,1), mute=actx.createGain(); mute.gain.value=0;
  const chunks=[];
  proc.onaudioprocess=e=>{ const d=e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let s=0; for(let i=0;i<d.length;i+=8) s+=d[i]*d[i]; level(Math.sqrt(s/(d.length/8)),ME_COLOR); };
  src.connect(proc); proc.connect(mute); mute.connect(actx.destination);
  rec={stream,src,proc,mute,chunks,start:performance.now(),rate:actx.sampleRate};
  setTalk("recording",0);
  rec.timer=setInterval(()=>{ if(!rec) return; const t=(performance.now()-rec.start)/1000; setTalk("recording",t); if(t>=MAX_SEC) stopRec(true); },250);
}
function stopRec(send){
  holding=false;
  if(!rec){ if($("talkLbl").textContent==="…") setTalk("idle"); return; }
  const r=rec; rec=null; clearInterval(r.timer);
  try{ r.src.disconnect(); r.proc.disconnect(); r.mute.disconnect(); }catch(e){}
  r.stream.getTracks().forEach(t=>t.stop()); session("playback"); setTalk("idle");
  const dur=(performance.now()-r.start)/1000;
  if(!send) return;
  if(dur<.6){ toast("Hold to record","#8ea6c8"); return; }
  const wav=encodeWav(r.chunks,r.rate);
  if(wsSend({type:"voice",audio:toB64(wav),dur:Math.round(dur*10)/10})){ toast("Sent","#49e39b"); twirl(ME_COLOR,4); }
  else toast("Not sent. Reconnecting…","#ff8a8a");
}
function encodeWav(chunks,inRate){
  let n=0; chunks.forEach(c=>n+=c.length);
  const all=new Float32Array(n); let o=0; chunks.forEach(c=>{ all.set(c,o); o+=c.length; });
  const ratio=inRate/RATE, outLen=Math.floor(n/ratio), pcm=new Int16Array(outLen);
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(all[i]));
  const gain=peak>0&&peak<.5 ? Math.min(4,.7/peak) : 1;      // lift quiet recordings
  for(let i=0;i<outLen;i++){ const a=Math.floor(i*ratio), b=Math.min(n,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=all[j];
    const v=Math.max(-1,Math.min(1,(s/Math.max(1,b-a))*gain)); pcm[i]=v<0?v*0x8000:v*0x7fff; }
  const buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf), w=(p,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(p+i,s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4,36+pcm.length*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,RATE,true); dv.setUint32(28,RATE*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm); return new Uint8Array(buf);
}
function toB64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function fromB64(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }

/* ---- play: the spiral spins and glows with the voice ---- */
let last=null, playing=null;
function decode(ab){ return new Promise((res,rej)=>{ const p=actx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); }
async function playMsg(){
  if(!last) return;
  unlockAudio(); if(!actx) return;
  try{ if(actx.state!=="running") await actx.resume(); }catch(e){}
  if(actx.state!=="running"){ $("msg").classList.add("wait"); return; }   // phone needs a tap first
  $("msg").classList.remove("wait");
  if(playing){ try{ playing.stop(); }catch(e){} playing=null; }
  let buf; try{ buf=await decode(last.ab.slice(0)); }catch(e){ toast("Couldn't play that message.","#ff8a8a"); return; }
  const src=actx.createBufferSource(), an=actx.createAnalyser(); an.fftSize=512; src.buffer=buf;
  src.connect(an); an.connect(actx.destination); playing=src;
  const data=new Float32Array(an.fftSize);
  $("msg").classList.add("on"); twirl(THEM_COLOR,12);
  (function tick(){ if(playing!==src) return; an.getFloatTimeDomainData(data); let s=0; for(let i=0;i<data.length;i++) s+=data[i]*data[i];
    level(Math.sqrt(s/data.length),THEM_COLOR); requestAnimationFrame(tick); })();
  src.onended=()=>{ if(playing===src){ playing=null; $("msg").classList.remove("on"); } };
  src.start();
}
function incoming(m){
  if(typeof m.audio!=="string") return;
  let ab; try{ ab=fromB64(m.audio); }catch(e){ return; }
  last={ab,name:String(m.name||"Phone").slice(0,16),dur:+m.dur||0};
  $("msgName").textContent=last.name; $("msgDur").textContent=fmt(last.dur); $("msg").hidden=false;
  try{ navigator.vibrate&&navigator.vibrate([120,60,120]); }catch(e){}
  playMsg();
}

/* ================= pairing over the server ================= */
let myCode=null, ws=null, wsOpen=false, peers=[], retry=0, wantCode=null;
function wsSend(m){ if(ws&&ws.readyState===1){ ws.send(JSON.stringify(m)); return true; } return false; }
function connect(){
  const proto=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(proto+"//"+location.host+"/ws");
  ws.onopen=()=>{ wsOpen=true; retry=0; if(wantCode) wsSend({type:"join",code:wantCode,name:me.name}); refresh(); };
  ws.onclose=()=>{ wsOpen=false; peers=[]; refresh(); setTimeout(connect,Math.min(8000,500*2**retry++)); };
  ws.onerror=()=>{};
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.type==="joined"){ myCode=m.code; refresh(); }
    if(m.type==="peers"){ peers=Array.isArray(m.peers)?m.peers:[]; refresh(); }
    if(m.type==="voice") incoming(m);
    if(m.type==="error"){ err(m.message); openSheet(false); wantCode=null; myCode=null; refresh(); }
  };
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&(!ws||ws.readyState>1)) connect(); });

function refresh(){
  const p=peers[0];
  partner=p?{name:String(p.name||"Phone").slice(0,16)}:null;
  const live=wsOpen&&!!myCode;
  $("chip").classList.toggle("on",live&&!!partner);
  $("chipText").textContent= !wantCode ? "Pair" : !wsOpen ? "Connecting…" : partner ? (peers.length>1?`${partner.name} +${peers.length-1}`:partner.name) : (wantCode||"").toUpperCase();
  $("talkBtn").disabled=!(live&&partner);
}

function err(m){ $("err").textContent=m; $("err").hidden=false; }
function openSheet(paired){ $("setupPart").hidden=paired; $("pairedPart").hidden=!paired; $("sheet").hidden=false; }
function pair(code){
  code=(code||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!me.name){ err("Add your name."); $("nameIn").focus(); return; }
  if(code.length!==4){ err("Codes are 4 characters."); return; }
  unlockAudio();
  $("err").hidden=true; wantCode=code;
  wsSend({type:"join",code,name:me.name});
  $("codeLbl").textContent=code.toUpperCase();
  $("sheet").hidden=true;
  try{ localStorage.setItem("beepcode",code); history.replaceState(null,"","#"+code); }catch(e){}
  refresh(); twirl("#4f9dff",5);
}
function unpair(){
  wsSend({type:"leave"}); wantCode=null; myCode=null; peers=[];
  try{ localStorage.removeItem("beepcode"); history.replaceState(null,"",location.pathname); }catch(e){}
  partner=null; refresh(); openSheet(false); }

$("nameIn").value=me.name;
$("nameIn").addEventListener("input",()=>{ me.name=$("nameIn").value.trim().slice(0,16); savePrefs(); if(wantCode) wsSend({type:"profile",name:me.name}); });
$("newBtn").onclick=()=>{ let c=""; crypto.getRandomValues(new Uint8Array(4)).forEach(b=>c+=ALPH[b%ALPH.length]); pair(c); };
$("joinBtn").onclick=()=>pair($("codeIn").value);
$("codeIn").addEventListener("keydown",e=>{ if(e.key==="Enter") pair($("codeIn").value); });
$("leaveBtn").onclick=unpair;
$("closeBtn").onclick=()=>{ $("sheet").hidden=true; };
$("chip").onclick=()=>openSheet(!!wantCode);
$("msg").onclick=playMsg;
$("scene").addEventListener("click",()=>{ if($("sheet").hidden) twirl(ME_COLOR,2.5); });

const tb=$("talkBtn");
tb.addEventListener("pointerdown",e=>{ if(tb.disabled) return; e.preventDefault(); try{ tb.setPointerCapture(e.pointerId); }catch(_){} startRec(); });
tb.addEventListener("pointerup",()=>stopRec(true));
tb.addEventListener("pointercancel",()=>stopRec(false));
tb.addEventListener("contextmenu",e=>e.preventDefault());
tb.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat){ e.preventDefault(); startRec(); } });
tb.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); stopRec(true); } });

(function(){ let c=(location.hash||"").slice(1); if(!c){ try{ c=localStorage.getItem("beepcode")||""; }catch(e){} }
  if(/^[a-z0-9]{4}$/i.test(c)) $("codeIn").value=c.toUpperCase(); })();
openSheet(false); refresh(); connect();
</script>
</body>
