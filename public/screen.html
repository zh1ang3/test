<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020407">
<title>Beep Link Screen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23020407%22/%3E%3Cg fill=%22none%22 stroke=%22%23ffb3d9%22 stroke-width=%221.3%22%3E%3Cpath d=%22M16 16C12 9 14 5 16 4c2 1 4 5 0 12zM16 16c7-4 11-2 12 0-1 2-5 4-12 0zM16 16c4 7 2 11 0 12-2-1-4-5 0-12zM16 16c-7 4-11 2-12 0 1-2 5-4 12 0z%22/%3E%3C/g%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: nothing but the water, edge to edge. Settings stay hidden (hold the top-left corner, or press S). Deliberately dark-only. */
:root{
  color-scheme:dark;
  --bg:#020407; --fg:#e8f4fb; --muted:#7f97a8; --line:rgba(210,235,250,.18);
  --display:"Sora",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --u:clamp(12px,1.05vmin,26px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.idle,body.idle *{cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#water{touch-action:none}
.nogl{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:calc(var(--u)*1.3);text-align:center;padding:2em}

/* hidden settings */
.panel{position:fixed;left:calc(var(--u)*2);top:calc(var(--u)*2);width:min(calc(var(--u)*22),calc(100vw - 32px));display:flex;flex-direction:column;gap:calc(var(--u)*.7);
  padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*1.1);background:rgba(6,12,20,.92);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.panel input{font:inherit;font-family:var(--mono);font-size:calc(var(--u)*1.4);letter-spacing:.3em;text-align:center;text-transform:uppercase;width:100%;
  padding:calc(var(--u)*.6);border-radius:calc(var(--u)*.7);border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--fg)}
.btn{font:inherit;font-size:calc(var(--u)*.9);cursor:pointer;border-radius:calc(var(--u)*.7);border:1px solid var(--line);padding:calc(var(--u)*.7) calc(var(--u)*.9);background:rgba(255,255,255,.05);color:var(--fg)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.6)}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#55627a;margin-right:.5em;vertical-align:middle}
.dot.on{background:#49e39b;box-shadow:0 0 10px #49e39b}
.status{font-size:calc(var(--u)*.8);color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid #cfeeff;outline-offset:2px}
/* a message: a point of light with a thin ring, where it landed */
.mark{position:fixed;left:0;top:0;width:calc(var(--u)*6);height:calc(var(--u)*6);margin:calc(var(--u)*-3) 0 0 calc(var(--u)*-3);
  background:none;border:0;padding:0;cursor:pointer;transition:opacity 1.2s;-webkit-tap-highlight-color:transparent}
.mark .pt{position:absolute;left:50%;top:50%;width:calc(var(--u)*.7);height:calc(var(--u)*.7);margin:calc(var(--u)*-.35);border-radius:50%;
  background:#fff;box-shadow:0 0 calc(var(--u)*.8) calc(var(--u)*.15) var(--c),0 0 calc(var(--u)*3) calc(var(--u)*.4) var(--c);animation:land 1s cubic-bezier(.2,1.6,.4,1) both}
.mark .rg{position:absolute;left:50%;top:50%;width:calc(var(--u)*3);height:calc(var(--u)*3);margin:calc(var(--u)*-1.5);border-radius:50%;
  border:1px solid color-mix(in srgb,var(--c) 70%,#fff);opacity:.5}
.mark.new .rg{opacity:.9;animation:beat 1.8s ease-out infinite}
.mark.new .pt{box-shadow:0 0 calc(var(--u)*1) calc(var(--u)*.25) var(--c),0 0 calc(var(--u)*4) calc(var(--u)*.8) var(--c)}
.mark.playing .rg{animation:ring 1.1s ease-out infinite}
.mark.heard:not(.playing):not(.paused){opacity:.6}
.mark.paused .rg{opacity:.9;transform:scale(1.15)}
.mark.paused .pt{opacity:.6}
@keyframes beat{0%{transform:scale(.5);opacity:1}70%{transform:scale(1.8);opacity:0}100%{opacity:0}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes land{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mark .rg,.mark .pt{animation:none!important}}

</style>
</head>
<body>
<canvas id="water" aria-label="Water. Touch to make ripples; touch a message to hear it."></canvas>

<div id="marks"></div>
<div class="panel" id="panel" hidden>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting</span></div>
  <input id="codeIn" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE" aria-label="Group code">
  <div class="row">
    <button class="btn primary" id="joinBtn">Join code</button>
    <button class="btn" id="newBtn">New code</button>
  </div>
  <div class="row">
    <button class="btn" id="soundBtn">Sound on</button>
    <button class="btn" id="fullBtn">Full screen</button>
  </div>
  <button class="btn" id="closeBtn">Close</button>
</div>

<script>
const $=id=>document.getElementById(id);
const COLORS=["#4f9dff","#ff8ab3","#5ee3c1","#ffc65c","#b18cff","#7fd3ff","#ff9a6b","#a6e36b"];
const ALPH="abcdefghjkmnpqrstuvwxyz23456789";
const colorOf=i=>COLORS[(+i||0)%COLORS.length];
const rgb01=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };
const fmt=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

/* =====================================================================
   WATER (WebGL2): a wave simulation and an ink field on the graphics card,
   lit like black water at night: soft lights reflected in the ripples,
   coloured ink glowing beneath, seen through the moving surface.
   x,y below are screen fractions with y from the top.
   ===================================================================== */
const drops=[], inks=[], FX=[];   // FX: light bursts of messages being heard
function disturb(x,y,r,s){ if(drops.length<32) drops.push([x,1-y,r,s]); }
function tint(x,y,r,col,s){ if(inks.length<16) inks.push([x,1-y,r,s,col[0],col[1],col[2]]); }
let renderFrame=()=>{};

(function(){
  const cv=$("water");
  const gl=cv.getContext("webgl2",{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:"high-performance"});
  const fail=()=>{ const d=document.createElement("div"); d.className="nogl"; d.textContent="This browser can't draw the water. Open this page in Chrome or Edge."; document.body.appendChild(d); };
  if(!gl||!gl.getExtension("EXT_color_buffer_float")){ fail(); return; }
  const linear32=!!gl.getExtension("OES_texture_float_linear");

  const VS=`#version 300 es
in vec2 p; out vec2 uv; void main(){ uv=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;
  const HEAD=`#version 300 es
precision highp float; in vec2 uv; out vec4 o;
`;
  const NOISE=`
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ return vnoise(p)*.6+vnoise(p*2.03+7.1)*.3+vnoise(p*4.1+3.7)*.1; }
vec2 curl(vec2 p){ float e=.02;
  return vec2(fbm(p+vec2(0,e))-fbm(p-vec2(0,e)), -(fbm(p+vec2(e,0))-fbm(p-vec2(e,0))))/(2.*e); }
`;
  // wave: r = height, g = velocity
  const WAVE=HEAD+`uniform sampler2D uW; uniform vec2 uTx;
void main(){
  vec4 i=texture(uW,uv);
  float avg=(texture(uW,uv-vec2(uTx.x,0)).r+texture(uW,uv+vec2(uTx.x,0)).r+texture(uW,uv-vec2(0,uTx.y)).r+texture(uW,uv+vec2(0,uTx.y)).r)*.25;
  i.g+=(avg-i.r)*2.; i.g*=.9955; i.r+=i.g; i.r*=.9993;
  o=i;
}`;
  const DROP=HEAD+`uniform sampler2D uW; uniform vec4 uD[32]; uniform int uN; uniform float uAsp;
void main(){
  vec4 i=texture(uW,uv);
  for(int k=0;k<32;k++){ if(k>=uN) break; vec4 d=uD[k];
    float f=max(0.,1.-length((uv-d.xy)*vec2(uAsp,1.))/d.z); f=.5-cos(f*3.14159265)*.5; i.r+=f*d.w; }
  o=i;
}`;
  // ink: carried by slow swirling currents and pushed by the waves, slowly fading
  const INK=HEAD+NOISE+`uniform sampler2D uI; uniform sampler2D uW; uniform vec2 uWTx; uniform float uT; uniform float uAsp;
uniform vec4 uS[16]; uniform vec3 uC[16]; uniform int uN;
void main(){
  vec2 q=uv*vec2(uAsp,1.);
  vec2 v=curl(q*1.1+vec2(uT*.03,-uT*.022))*.0024+curl(q*3.4-vec2(uT*.05,uT*.035))*.0009;
  float hL=texture(uW,uv-vec2(uWTx.x,0)).r, hR=texture(uW,uv+vec2(uWTx.x,0)).r, hD=texture(uW,uv-vec2(0,uWTx.y)).r, hU=texture(uW,uv+vec2(0,uWTx.y)).r;
  v+=vec2(hL-hR,hD-hU)*.004;
  vec3 c=texture(uI,uv-v*vec2(1./uAsp,1.)).rgb*.9984;
  for(int k=0;k<16;k++){ if(k>=uN) break; vec4 s=uS[k];
    float d=length((uv-s.xy)*vec2(uAsp,1.))/s.z; c+=uC[k]*s.w*exp(-d*d*3.); }
  o=vec4(min(c,vec3(3.)),1.);
}`;
  const SCENE=HEAD+NOISE+`uniform sampler2D uW; uniform sampler2D uI; uniform vec2 uWTx; uniform float uT; uniform float uAsp;
vec3 env(vec2 d){
  vec3 c=vec3(.002,.004,.009);
  vec2 k=d-vec2(-.62,.40);  c+=vec3(.50,.70,1.)*exp(-dot(k,k)*7.)*1.15;                 // big soft light, upper left
  c+=vec3(.95,.98,1.)*exp(-pow((d.y-.27-.04*sin(uT*.05))/.022,2.))*smoothstep(1.,.15,abs(d.x+.1))*2.2;   // long strip
  c+=vec3(.45,.92,1.)*exp(-pow((d.x+d.y*.35-.40)/.018,2.))*smoothstep(.9,.05,abs(d.y))*1.4;           // crossing strip
  c+=vec3(.95,.55,.85)*exp(-pow((length(d-vec2(.55,-.55))-.30)/.03,2.))*.45;                          // faint ring light
  c+=vec3(.20,.06,.40)*smoothstep(.95,0.,length(d-vec2(.55,-.40)))*.35;
  c+=vec3(.00,.22,.28)*smoothstep(1.1,0.,length(d-vec2(-.25,-.55)))*.30;
  return c;
}
void main(){
  float hL=texture(uW,uv-vec2(uWTx.x,0)).r, hR=texture(uW,uv+vec2(uWTx.x,0)).r, hD=texture(uW,uv-vec2(0,uWTx.y)).r, hU=texture(uW,uv+vec2(0,uWTx.y)).r;
  vec2 p=(uv-.5)*vec2(uAsp,1.);
  // a slow, wide swell so the reflections glide even when nobody touches
  vec2 sw=vec2(fbm(p*1.1+vec2(uT*.03,0.))-fbm(p*1.1+vec2(.05+uT*.03,0.)),fbm(p*1.1+vec2(0.,uT*.025))-fbm(p*1.1+vec2(0.,.05+uT*.025)))*.35;
  vec3 N=normalize(vec3((hL-hR)*14.+sw.x,(hD-hU)*14.+sw.y,1.));
  float slope=1.-N.z;
  // reflection: what the tilted surface sees, plus a little perspective so calm water still shows the big light softly
  vec3 R=reflect(vec3(0,0,-1),N);
  vec3 refl=env(R.xy*1.15+p*.42);
  float fres=.035+.965*pow(clamp(slope*7.,0.,1.),1.5);
  // beneath: the ink, bent by the surface, each colour bent slightly differently
  vec2 off=N.xy*.07;
  vec3 ink=vec3(texture(uI,uv+off).r,texture(uI,uv+off*1.18).g,texture(uI,uv+off*1.36).b);
  vec3 deep=mix(vec3(.001,.003,.006),vec3(.004,.012,.022),fbm(p*1.6+uT*.01)*smoothstep(1.2,.1,length(p)));
  vec3 col=deep+ink*(.55+3.*slope)+refl*fres;
  // thin-film shimmer on the steeper ripples
  col+=(.5+.5*cos(6.2831*(slope*4.+vec3(0.,.33,.67))))*smoothstep(.02,.15,slope)*.035;
  // the water's height drawn as fine glowing contour lines
  float h=texture(uW,uv).r, hh=h*36.;
  float ln=1.-clamp(abs(fract(hh+.5)-.5)/max(fwidth(hh),1e-4)*.85,0.,1.);
  float inkL=dot(ink,vec3(.333));
  vec3 lc=mix(vec3(.6,.88,1.),ink/max(inkL,1e-3)*.75,clamp(inkL*1.6,0.,.9));
  col+=lc*ln*smoothstep(.006,.05,abs(h))*.38;
  // the ink's edges glow like marbled paint
  vec2 e=uWTx*2.;
  vec3 gx=texture(uI,uv+off+vec2(e.x,0)).rgb-texture(uI,uv+off-vec2(e.x,0)).rgb, gy=texture(uI,uv+off+vec2(0,e.y)).rgb-texture(uI,uv+off-vec2(0,e.y)).rgb;
  col+=sqrt(gx*gx+gy*gy)*3.5;
  // sharp glints of a point light
  col+=vec3(1.,.97,.92)*pow(max(dot(R,normalize(vec3(-.30,.38,.875))),0.),900.)*6.;
  o=vec4(col,1.);
}`;
  const BRIGHT=HEAD+`uniform sampler2D uS; void main(){ vec3 c=texture(uS,uv).rgb; o=vec4(max(c-vec3(.55),0.),1.); }`;
  const BLUR=HEAD+`uniform sampler2D uS; uniform vec2 uDir;
void main(){ vec3 c=texture(uS,uv).rgb*.227;
  c+=(texture(uS,uv+uDir*1.385).rgb+texture(uS,uv-uDir*1.385).rgb)*.316;
  c+=(texture(uS,uv+uDir*3.231).rgb+texture(uS,uv-uDir*3.231).rgb)*.070; o=vec4(c,1.); }`;
  // final pass: tone, lens, grain, and the light burst of a message being heard
  const FINAL=HEAD+`uniform sampler2D uS; uniform sampler2D uB; uniform float uT; uniform float uAsp;
uniform vec4 uF[4]; uniform vec3 uFC[4]; uniform int uFN;
float h1(float x){ return fract(sin(x*127.1+.3)*43758.5453); }
float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h1(i),h1(i+1.),f); }
void main(){
  // when a message is heard, its ripple circles split into spectral light and streak outward
  vec2 suv=uv; float energy=0.; vec3 add=vec3(0.); vec2 disp=vec2(0.); float glitch=0.;
  for(int k=0;k<4;k++){ if(k>=uFN) break;
    vec4 f=uF[k]; float I=f.z, sd=f.w;
    vec2 d=(uv-f.xy)*vec2(uAsp,1.); float r=length(d);
    float Rm=.16+.06*I, win=smoothstep(Rm,Rm*.25,r)*I;
    if(win<.002) continue;
    energy=max(energy,win);
    vec2 dir=d/max(r,1e-4)/vec2(uAsp,1.);
    disp+=dir*win;
    // light streaks: the bright ripple highlights smeared outward, each step a different colour of the spectrum
    vec3 acc=vec3(0.);
    for(int s=1;s<=10;s++){ float fs=float(s)/10.;
      vec3 b=texture(uB,uv-dir*fs*.045*(.6+I)).rgb+texture(uS,uv-dir*fs*.045*(.6+I)).rgb*.35;
      vec3 sp=.5+.5*cos(6.2831*(fs*.85+sd+vec3(0.,.33,.67)));
      acc+=b*sp*(1.-fs*.6); }
    add+=acc*.22*win;
    // a little glitch, only on the brightest moments
    float band=floor(uv.y*90.), tick=floor(uT*12.);
    float on=step(.86,fract(sin(band*12.9+tick*3.7+sd)*4375.5));
    suv.x+=(fract(sin(band*7.1+tick)*913.7)-.5)*.018*on*win*step(.6,I);
    glitch=max(glitch,on*win);
  }
  // spectral split: red pushed out, blue pulled in, radially around the circles
  float ca=.0012;
  vec2 cr=disp*.010+vec2(ca,0.), cb=-disp*.010-vec2(ca,0.);
  vec3 c=vec3(texture(uS,suv+cr).r,texture(uS,suv).g,texture(uS,suv+cb).b)
        +vec3(texture(uB,suv+cr*1.6).r,texture(uB,suv).g,texture(uB,suv+cb*1.6).b)*.85+add;
  c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);                     // filmic
  vec2 p=(uv-.5)*vec2(uAsp,1.);
  c*=mix(.62,1.,smoothstep(1.05,.25,length(p)));               // lens falloff
  c=pow(clamp(c,0.,1.),vec3(1./2.2));
  c+=(fract(sin(dot(uv*vec2(1283.,947.)+uT,vec2(12.9898,78.233)))*43758.5453)-.5)*(.018+energy*.05);   // grain, heavier around a message being heard
  o=vec4(c,1.);
}`;

  const compile=(t,s)=>{ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x); if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const vs=compile(gl.VERTEX_SHADER,VS);
  const prog=fs=>{ const p=gl.createProgram(); gl.attachShader(p,vs); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs)); gl.bindAttribLocation(p,0,"p"); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); u[a.name.replace(/\[0\]$/,"")]=gl.getUniformLocation(p,a.name); }
    return {p,u}; };
  let P;
  try{ P={wave:prog(WAVE),drop:prog(DROP),ink:prog(INK),scene:prog(SCENE),bright:prog(BRIGHT),blur:prog(BLUR),final:prog(FINAL)}; }
  catch(e){ console.error(e); fail(); return; }

  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

  function target(w,h,precise){
    const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
    const f32=precise&&linear32;
    gl.texImage2D(gl.TEXTURE_2D,0,f32?gl.RGBA32F:gl.RGBA16F,w,h,0,gl.RGBA,f32?gl.FLOAT:gl.HALF_FLOAT,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    return {tex,fb,w,h};
  }
  const pair=(w,h,pr)=>{ const a=target(w,h,pr), b=target(w,h,pr); return {r:a,w:b,swap(){ const t=this.r; this.r=this.w; this.w=t; }}; };
  function draw(pr,dst,setup){
    gl.useProgram(pr.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst?dst.fb:null);
    gl.viewport(0,0,dst?dst.w:cv.width,dst?dst.h:cv.height);
    setup(pr.u); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  const bind=(unit,t,loc)=>{ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t.tex); gl.uniform1i(loc,unit); };

  let W,I,S,B1,B2,asp=1;
  function size(){
    const dpr=Math.min(devicePixelRatio||1,1.5), sc=Math.min(1,2560/(innerWidth*dpr));
    cv.width=Math.round(innerWidth*dpr*sc); cv.height=Math.round(innerHeight*dpr*sc); asp=cv.width/cv.height;
    const sw=Math.max(256,Math.min(1024,Math.round(cv.width/2))), sh=Math.round(sw/asp);
    W=pair(sw,sh,true); I=pair(Math.round(sw*.6),Math.round(sh*.6),false);
    S=target(cv.width,cv.height,false);
    const bw=Math.max(64,Math.round(cv.width/4)), bh=Math.max(36,Math.round(cv.height/4));
    B1=target(bw,bh,false); B2=target(bw,bh,false);
  }
  addEventListener("resize",size); size();

  const fBuf=new Float32Array(16), fcBuf=new Float32Array(12);
  const dBuf=new Float32Array(32*4), sBuf=new Float32Array(16*4), cBuf=new Float32Array(16*3);
  renderFrame=(t)=>{
    if(drops.length){
      drops.forEach((d,i)=>dBuf.set(d,i*4));
      draw(P.drop,W.w,u=>{ bind(0,W.r,u.uW); gl.uniform4fv(u.uD,dBuf); gl.uniform1i(u.uN,drops.length); gl.uniform1f(u.uAsp,asp); }); W.swap(); drops.length=0;
    }
    for(let k=0;k<2;k++){ draw(P.wave,W.w,u=>{ bind(0,W.r,u.uW); gl.uniform2f(u.uTx,1/W.r.w,1/W.r.h); }); W.swap(); }
    inks.forEach((s,i)=>{ sBuf.set(s.slice(0,4),i*4); cBuf.set(s.slice(4),i*3); });
    draw(P.ink,I.w,u=>{ bind(0,I.r,u.uI); bind(1,W.r,u.uW); gl.uniform2f(u.uWTx,1/W.r.w,1/W.r.h); gl.uniform1f(u.uT,t); gl.uniform1f(u.uAsp,asp);
      gl.uniform4fv(u.uS,sBuf); gl.uniform3fv(u.uC,cBuf); gl.uniform1i(u.uN,inks.length); }); I.swap(); inks.length=0;
    draw(P.scene,S,u=>{ bind(0,W.r,u.uW); bind(1,I.r,u.uI); gl.uniform2f(u.uWTx,1/W.r.w,1/W.r.h); gl.uniform1f(u.uT,t); gl.uniform1f(u.uAsp,asp); });
    draw(P.bright,B1,u=>bind(0,S,u.uS));
    for(let k=0;k<2;k++){
      draw(P.blur,B2,u=>{ bind(0,B1,u.uS); gl.uniform2f(u.uDir,1/B1.w,0); });
      draw(P.blur,B1,u=>{ bind(0,B2,u.uS); gl.uniform2f(u.uDir,0,1/B1.h); });
    }
    const n=Math.min(4,FX.length); fBuf.fill(0); fcBuf.fill(0);
    for(let i=0;i<n;i++){ const f=FX[i]; fBuf.set([f.x,1-f.y,f.i,f.seed],i*4); fcBuf.set(f.c,i*3); }
    draw(P.final,null,u=>{ bind(0,S,u.uS); bind(1,B1,u.uB); gl.uniform1f(u.uT,t%100); gl.uniform1f(u.uAsp,asp);
      gl.uniform4fv(u.uF,fBuf); gl.uniform3fv(u.uFC,fcBuf); gl.uniform1i(u.uFN,n); });
  };
})();

/* ================= sound ================= */
let actx=null, master=null, soundOn=true;
try{ soundOn=localStorage.getItem("screensound")!=="off"; }catch(e){}
function unlockAudio(){
  try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=soundOn?1:0; master.connect(actx.destination); }
    if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function plop(strength){
  if(!actx||actx.state!=="running"||!soundOn) return;
  const t=actx.currentTime, f0=420+Math.random()*420, o=actx.createOscillator(), g=actx.createGain();
  o.type="sine"; o.frequency.setValueAtTime(f0*1.9,t); o.frequency.exponentialRampToValueAtTime(f0*.42,t+.15);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18*strength,t+.006); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g).connect(master); o.start(t); o.stop(t+.27);
}
function decode(ab){ return new Promise((res,rej)=>{ const p=actx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); }
function fromB64(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }

/* =====================================================================
   MESSAGES live in the water itself: nothing is drawn on top.
   Recording: the water trembles where it will land.
   Received: a slight ripple there, repeating softly until someone touches it.
   Touched: it plays, ripples out, and the circles burst into prismatic light
   that moves with the voice, then settles back into water. It stays, and can
   be touched again.
   ===================================================================== */
const notes=[], budFrom=new Map();
let playing=null;
const hitR=()=>Math.min(innerWidth,innerHeight)*.08;

function freeSpot(){
  let best=null, bestD=-1; const a=innerWidth/Math.max(1,innerHeight);
  for(let k=0;k<30;k++){ const p={x:.12+Math.random()*.76,y:.14+Math.random()*.72};
    let d=1; notes.forEach(n=>d=Math.min(d,Math.hypot((n.x-p.x)*a,n.y-p.y)));
    if(d>bestD){ bestD=d; best=p; } }
  return best;
}
function makeNote(from,colorIdx){
  const p=freeSpot(), n={from,x:p.x,y:p.y,c:rgb01(colorOf(colorIdx)),state:"bud",ab:null,name:"",nextBeat:0,until:Infinity,seed:Math.random()};
  notes.push(n); return n;
}
function recSignal(v){
  const id=String(v.from);
  if(v.on){ let n=budFrom.get(id); if(!n){ n=makeNote(id,v.color); budFrom.set(id,n); } n.until=Infinity; }
  else { const n=budFrom.get(id); if(n) n.until=performance.now()+8000; }
}
function incoming(v){
  if(typeof v.audio!=="string") return;
  let ab; try{ ab=fromB64(v.audio); }catch(e){ return; }
  const id=String(v.from);
  let n=budFrom.get(id); budFrom.delete(id);
  if(!n) n=makeNote(id,v.color);
  n.ab=ab; n.name=String(v.name||""); n.state="new"; n.until=Infinity; n.nextBeat=performance.now()+1600;
  if(!n.el){ const el=document.createElement("button"); el.className="mark new"; el.innerHTML='<span class="rg"></span><span class="pt"></span>';
    el.style.setProperty("--c",colorOf(v.color)); el.style.transform=`translate(${n.x*innerWidth}px,${n.y*innerHeight}px)`;
    el.setAttribute("aria-label",`Message from ${n.name||"someone"}. Play`);
    el.addEventListener("pointerdown",e=>{ e.stopPropagation(); unlockAudio(); if(firstTouch){ firstTouch=false; goFull(); } toggle(n); });
    $("marks").appendChild(el); n.el=el; }
  disturb(n.x,n.y,.035,-.22); plop(.6);   // a slight ripple where it lands
  tint(n.x,n.y,.07,n.c,1.4);   // and its colour blooms into the water, a glowing pool that marks it
  for(let k=0;k<5;k++){ const a=Math.random()*6.283, r=.02+Math.random()*.04; tint(n.x+Math.cos(a)*r*innerHeight/innerWidth,n.y+Math.sin(a)*r,.025+Math.random()*.03,n.c,.5+Math.random()*.6); }
  const kept=notes.filter(x=>x.state!=="bud");
  if(kept.length>12){ const old=kept.find(x=>x.state==="heard")||kept[0]; notes.splice(notes.indexOf(old),1); if(old.el){ old.el.style.opacity="0"; setTimeout(()=>old.el.remove(),1300); } }
}
function updateNotes(now){
  for(let i=notes.length-1;i>=0;i--){ const n=notes[i];
    if(n.state==="bud"){
      if(now>n.until){ notes.splice(i,1); continue; }
      if(Math.random()<.45) disturb(n.x+(Math.random()-.5)*.025,n.y+(Math.random()-.5)*.035,.006,-.035);
      if(Math.random()<.15) tint(n.x,n.y,.02,n.c,.015);
    } else {
      if(now>(n.nextGlow||0)){ tint(n.x,n.y,.05,n.c,n.state==="new"||n.el&&n.el.classList.contains("paused")?.09:.05); n.nextGlow=now+300; }
    }
    if(n.state!=="bud"&&now>n.nextBeat&&!(playing&&playing.n===n)){
      // waiting: soft circles every couple of seconds; heard: fainter and slower
      if(n.state==="new"){ disturb(n.x,n.y,.03,-.09); tint(n.x,n.y,.025,n.c,.03); n.nextBeat=now+1800; }
      else { disturb(n.x,n.y,.025,-.045); n.nextBeat=now+4200; }
    }
  }
}

// click a message: play it; click it again while it plays: pause; again: carry on from there
function toggle(n){ if(playing&&playing.n===n) pause(); else play(n); }
function pause(){
  const p=playing; if(!p) return;
  p.paused=true; p.n.offset=p.off+(actx.currentTime-p.t0);
  try{ p.src.stop(); }catch(e){}
}
async function play(n){
  unlockAudio(); if(!actx||!n.ab) return;
  try{ if(actx.state!=="running") await actx.resume(); }catch(e){}
  if(playing) pause();                       // another message keeps its place
  if(!n.buf){ try{ n.buf=await decode(n.ab.slice(0)); }catch(e){ return; } }
  const off=(n.offset||0)<n.buf.duration-.1?(n.offset||0):0, fresh=off===0;
  const src=actx.createBufferSource(), an=actx.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.55;
  src.buffer=n.buf; src.connect(an); an.connect(master);
  const fx={x:n.x,y:n.y,i:1,seed:Math.random(),c:lighten(n.c,.2),live:true};
  FX.unshift(fx); if(FX.length>4) FX.length=4;
  const p={src,an,n,fx,td:new Float32Array(1024),nextRing:0,off,t0:actx.currentTime,paused:false}; playing=p;
  n.state="heard"; if(n.el){ n.el.classList.remove("new","paused"); n.el.classList.add("heard","playing"); n.el.setAttribute("aria-label","Pause message"); }
  // it ripples out (a full ripple from the start, a smaller one when it carries on)
  if(fresh){ disturb(n.x,n.y,.09,-1.5); plop(1.2); setTimeout(()=>disturb(n.x,n.y,.06,-1.0),260); setTimeout(()=>disturb(n.x,n.y,.05,-.7),560); }
  else { disturb(n.x,n.y,.05,-.6); }
  tint(n.x,n.y,.07,n.c,.6);
  src.onended=()=>{
    if(n.el){ n.el.classList.remove("playing"); n.el.classList.toggle("paused",p.paused); n.el.setAttribute("aria-label",p.paused?"Resume message":"Play message"); }
    if(!p.paused) n.offset=0;
    fx.live=false; fx.end=performance.now(); fx.i0=fx.i;
    if(playing===p) playing=null; n.nextBeat=performance.now()+(p.paused?1800:4200);
  };
  src.start(0,off);
}
function lighten(c,k){ return c.map(v=>v+(1-v)*k); }
function tickPlayback(now,dt){
  const p=playing;
  if(p){
    p.an.getFloatTimeDomainData(p.td); let s=0; for(let i=0;i<p.td.length;i+=2) s+=p.td[i]*p.td[i];
    const lvl=Math.min(1,Math.sqrt(s/(p.td.length/2))*5);
    // the light follows the voice
    const want=.55+lvl*.6; p.fx.i+=(want-p.fx.i)*(want>p.fx.i?.4:.1);
    if(now>p.nextRing){ disturb(p.n.x,p.n.y,.035,-(.08+lvl*1.1)); tint(p.n.x,p.n.y,.04,p.n.c,.03+lvl*.2); p.nextRing=now+120; }
  }
  // finished bursts fade back into water
  for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; if(!f.live){ f.i=f.i0*Math.exp(-(now-f.end)/650); if(f.i<.01) FX.splice(i,1); } }
}

/* ================= main loop ================= */
let lastT=performance.now(), nextRain=performance.now()+1200;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const THREADS=[{c:[.15,.4,.9],s:.07,p:0},{c:[.45,.18,.8],s:.055,p:2.3},{c:[.05,.6,.65],s:.063,p:4.1}];
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(now>nextRain){ disturb(.06+Math.random()*.88,.08+Math.random()*.84,.004+Math.random()*.004,-(.06+Math.random()*.1)); nextRain=now+(reduce?7000:900+Math.random()*2600); }
  if(!reduce) THREADS.forEach((th,i)=>{ const t=now/1000*th.s+th.p;   // slow threads of ink the currents twist into marbling
    tint(.5+.38*Math.sin(t*1.3+i)*Math.cos(t*.37),.5+.34*Math.sin(t*.9+i*2.1),.007,th.c,.05); });
  tickPlayback(now,dt); updateNotes(now);
  renderFrame(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= touch ================= */
const touches=new Map(), TOUCH=[.55,.85,1], cvs=$("water");
let firstTouch=true, holdT=null;
addEventListener("resize",()=>notes.forEach(n=>{ if(n.el) n.el.style.transform=`translate(${n.x*innerWidth}px,${n.y*innerHeight}px)`; }));
function hit(px,py){
  let best=null, bd=1e9;
  notes.forEach(n=>{ if(!n.ab) return; const d=Math.hypot(px-n.x*innerWidth,py-n.y*innerHeight); if(d<hitR()&&d<bd){ bd=d; best=n; } });
  return best;
}
cvs.addEventListener("pointerdown",e=>{
  unlockAudio(); $("panel").hidden=true;
  if(firstTouch){ firstTouch=false; goFull(); }
  if(e.clientX<innerWidth*.08&&e.clientY<innerHeight*.1){ clearTimeout(holdT); holdT=setTimeout(openPanel,2000); }   // hidden settings
  const n=hit(e.clientX,e.clientY);
  if(n){ toggle(n); return; }
  const x=e.clientX/innerWidth, y=e.clientY/innerHeight;
  disturb(x,y,.022,-.55); tint(x,y,.03,TOUCH,.06); plop(1);
  touches.set(e.pointerId,{x,y}); try{ cvs.setPointerCapture(e.pointerId); }catch(_){}
});
cvs.addEventListener("pointermove",e=>{
  const p=touches.get(e.pointerId); if(!p) return;
  const x=e.clientX/innerWidth, y=e.clientY/innerHeight, dx=x-p.x, dy=y-p.y, d=Math.hypot(dx*innerWidth,dy*innerHeight);
  if(d<6) return;
  clearTimeout(holdT);
  const steps=Math.min(6,Math.ceil(d/24));
  for(let s=1;s<=steps;s++){ const k=s/steps; disturb(p.x+dx*k,p.y+dy*k,.012,-.10); }
  tint(x,y,.018,TOUCH,.015); p.x=x; p.y=y;
});
const up=e=>{ touches.delete(e.pointerId); clearTimeout(holdT); };
cvs.addEventListener("pointerup",up); cvs.addEventListener("pointercancel",up);
addEventListener("keydown",e=>{ if((e.key==="s"||e.key==="S")&&document.activeElement.tagName!=="INPUT") openPanel(); if(e.key==="Escape") $("panel").hidden=true; });
let idleT=null;
addEventListener("pointermove",()=>{ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add("idle"),2500); });
idleT=setTimeout(()=>document.body.classList.add("idle"),2500);
function goFull(){ const d=document.documentElement; try{ const r=(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }

/* ================= group connection ================= */
let ws=null, retry=0, code=null, live=false;
try{ code=(location.hash.slice(1).match(/^[a-z0-9]{4}$/i)||[])[0]||localStorage.getItem("screencode"); }catch(e){}
function newCode(){ let c=""; crypto.getRandomValues(new Uint8Array(4)).forEach(b=>c+=ALPH[b%ALPH.length]); return c; }
if(!code||!/^[a-z0-9]{4}$/i.test(code)) code=newCode();
code=code.toLowerCase();
function setLive(on){ live=on; $("dot").classList.toggle("on",on); $("status").textContent=on?"Connected":"Connecting"; }
function wsSend(m){ if(ws&&ws.readyState===1){ ws.send(JSON.stringify(m)); return true; } return false; }
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/ws");
  ws.onopen=()=>{ retry=0; wsSend({type:"join",code,kind:"screen",name:"Big screen"}); };
  ws.onclose=()=>{ setLive(false); setTimeout(connect,Math.min(8000,500*2**retry++)); };
  ws.onerror=()=>{};
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.type==="joined") setLive(true);
    if(m.type==="rec") recSignal(m);
    if(m.type==="voice") incoming(m);
  };
}
function remember(){ try{ localStorage.setItem("screencode",code); history.replaceState(null,"","#"+code); }catch(e){} }
function switchTo(c){
  c=(c||"").toLowerCase().replace(/[^a-z0-9]/g,""); if(c.length!==4) return;
  code=c; remember(); notes.forEach(n=>n.el&&n.el.remove()); notes.length=0; budFrom.clear();
  wsSend({type:"join",code,kind:"screen",name:"Big screen"}); $("panel").hidden=true;
}
function openPanel(){ $("codeIn").value=code.toUpperCase(); $("panel").hidden=false; document.body.classList.remove("idle"); }
$("joinBtn").onclick=()=>switchTo($("codeIn").value);
$("codeIn").addEventListener("keydown",e=>{ if(e.key==="Enter") switchTo($("codeIn").value); });
$("newBtn").onclick=()=>switchTo(newCode());
$("closeBtn").onclick=()=>{ $("panel").hidden=true; };
function setSound(on){ soundOn=on; $("soundBtn").textContent=on?"Sound on":"Sound off"; if(master) master.gain.value=on?1:0; try{ localStorage.setItem("screensound",on?"on":"off"); }catch(e){} }
$("soundBtn").onclick=()=>setSound(!soundOn); setSound(soundOn);
$("fullBtn").onclick=goFull;

let wake=null;
async function keepAwake(){ try{ if(navigator.wakeLock&&!wake){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>wake=null); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ keepAwake(); if(!ws||ws.readyState>1) connect(); } });
document.addEventListener("pointerdown",keepAwake,{once:true});

remember(); connect(); keepAwake();
</script>
</body>
